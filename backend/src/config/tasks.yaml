retrieve_task:
  description: >
    Retrieve relevant information from notes based on user query: {query}
  expected_output: >
    Relevant extracted note content

teach_task:
  description: >
    Use ONLY the retrieved notes to answer the question.
    If notes are empty, say clearly: "No notes found."

    You MUST NOT say you don't have access.
    You MUST attempt explanation using retrieved context.

  expected_output: >
    Clear teacher-style explanation grounded in notes

verify_task:
  description: >
    Ensure the answer is grounded in notes and contains no hallucination.
  expected_output: >
    Final validated answer